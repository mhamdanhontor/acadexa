<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honor Knowledge Academy — Server Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 40px;
        width: 440px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      .logo {
        width: 56px; height: 56px;
        background: #4f46e5;
        color: white;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px;
        margin: 0 auto 16px;
      }
      h1 { text-align: center; font-size: 20px; margin: 0 0 4px; color: #111827; }
      p.subtitle { text-align: center; color: #6b7280; font-size: 13px; margin: 0 0 24px; }
      label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 12px;
      }
      input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
      .hint { font-size: 12px; color: #9ca3af; margin: -6px 0 16px; }
      .buttons { display: flex; gap: 10px; margin-top: 8px; }
      button {
        flex: 1;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      #test-btn { background: #f3f4f6; color: #374151; }
      #test-btn:hover { background: #e5e7eb; }
      #save-btn { background: #4f46e5; color: white; }
      #save-btn:hover { background: #4338ca; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      #status {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }
      #status.ok { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
      #status.err { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><i class="fas fa-graduation-cap"></i></div>
      <h1>Connect to your Academy Server</h1>
      <p class="subtitle">Enter the address of your academy's central Acadexa server (given to you by your IT admin).</p>

      <label for="server-url-input">Server Address</label>
      <input id="server-url-input" type="text" placeholder="e.g. https://api.myacademy.com or 192.168.1.10:8000" />
      <p class="hint">This should point to wherever your academy's backend + PostgreSQL database is hosted.</p>

      <div class="buttons">
        <button id="test-btn">Test Connection</button>
        <button id="save-btn">Save &amp; Continue</button>
      </div>

      <div id="status"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
